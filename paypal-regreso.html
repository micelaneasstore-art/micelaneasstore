<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirmando PayPal | MicelaneasStore</title><style>body{font:16px Arial,sans-serif;background:#fff8f2;color:#222;display:grid;place-items:center;min-height:90vh}.panel{background:white;border:1px solid #eee;border-radius:18px;padding:30px;max-width:480px;text-align:center}a{color:#c72554}</style></head><body><main class="panel"><h1>MicelaneasStore</h1><p id="estado">Verificando tu pago con PayPal…</p><a id="volver" href="/crear.html" hidden>Volver al generador</a></main><script>
(async()=>{const estado=document.getElementById("estado");try{const id=new URLSearchParams(location.search).get("token");if(!id)throw Error("PayPal no devolvió una orden.");const r=await fetch("/api/paypal-capturar-orden",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({order_id:id})});const data=await r.json();if(!r.ok||!data.token)throw Error(data.error||"No se confirmó el pago.");location.replace("/descarga-correo.html?token="+encodeURIComponent(data.token))}catch(e){estado.textContent="No pudimos confirmar el pago: "+e.message;document.getElementById("volver").hidden=false}})();
</script></body></html>
